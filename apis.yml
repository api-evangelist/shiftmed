aid: shiftmed
name: ShiftMed
description: 'ShiftMed is a McLean, Virginia healthcare workforce technology company
  operating an on-demand clinician marketplace and AI-powered open shift management
  platform for hospitals, health systems, skilled nursing facilities and post-acute
  providers. It matches credentialed W-2 CNAs, LPNs and RNs to open shifts, and markets
  an API that lets a facility tap that clinician network directly from its own scheduling
  stack. The API surface reaches customers through workforce-management partner integrations
  — UKG Pro Workforce Management (formerly UKG Dimensions), symplr Smart Square, QGenda,
  Smartlinx and Attendance on Demand — alongside file-based SFTP feeds. ShiftMed publishes
  no public developer portal, documentation, specification or SDK; API access is arranged
  through a workforce consultation.'
