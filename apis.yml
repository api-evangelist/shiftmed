apis:
- name: ShiftMed Workforce API
  description: 'ShiftMed markets an API that lets a hospital, health system or post-acute
    facility tap its network of credentialed CNAs, LPNs and RNs and fill open shifts
    on demand from within its existing scheduling system. ShiftMed describes it publicly
    as a "public API" that "can be embedded in health system platforms", delivered
    alongside file-based (SFTP) integration. No specification, reference documentation
    or developer portal is published; the production host answers on /v1 but access
    is arranged through a workforce consultation.'
